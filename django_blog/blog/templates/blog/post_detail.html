{% extends 'blog/base.html' %}
{% block content %}
    <article>
        <h1>{{ object.title }}</h1>
        <p class='meta'>By {{ object.author }} on {{ object.published_date|date:"F d, Y" }}</p>
        <div class='post-content'>
            {{ object.content }}
        </div>
    </article>

    {% if object.author == user %}
        <div class='actions'>
            <a href='{% url 'post-update' object.pk %}'>Edit</a>
            <a href='{% url 'post-delete' object.pk %}'>Delete</a>
        </div>
    {% endif %}

    <a href='{% url 'posts' %}'>Back to Posts</a>
{% endblock %}
